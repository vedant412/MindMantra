name: Backend PostgreSQL checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: mindmitra_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: ai-backend
    env:
      DATABASE_URL: postgresql+psycopg://app_runtime:test-runtime-password@localhost:5432/mindmitra_test
      DATABASE_MIGRATION_URL: postgresql+psycopg://postgres:test-only-password@localhost:5432/mindmitra_test
      TEST_DATABASE_URL: postgresql+psycopg://app_runtime:test-runtime-password@localhost:5432/mindmitra_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - name: Configure isolated runtime role
        run: |
          python - <<'PY'
          import os, pathlib, psycopg
          url = os.environ['DATABASE_MIGRATION_URL'].replace('postgresql+psycopg://', 'postgresql://')
          with psycopg.connect(url) as db:
              db.execute(pathlib.Path('deploy/runtime-role.sql').read_text())
              db.execute("ALTER ROLE app_runtime PASSWORD 'test-runtime-password'")
          PY
      - run: pytest -q
